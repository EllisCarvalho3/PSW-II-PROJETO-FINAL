{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="bg-dark text-white p-4 rounded shadow">
                <h1 class="h3 mb-3">Recuperar senha</h1>
                <p class="text-light">Informe o e-mail cadastrado. Enviaremos um link para criar uma nova senha.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.email.errors }}
                    <label for="id_email" class="form-label">E-mail</label>
                    <input type="email" name="email" id="id_email" class="form-control mb-3" autocomplete="email" required>
                    <button type="submit" class="btn btn-primary w-100">Enviar link de recuperação</button>
                </form>
                <a href="{% url 'login' %}" class="d-block mt-3 text-center">Voltar para o login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | Mavier Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-page">
    <main class="auth-card"><div class="auth-card__inner">
        <header class="auth-brand"><i class="fa fa-music"></i><h1>Mavier <span>Academy</span></h1><p>Recuperação de acesso</p></header>
        <p class="auth-help">Informe o e-mail cadastrado. Enviaremos um link para você criar uma nova senha.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.email.errors }}
            <label for="id_email">E-mail</label>
            {{ form.email }}
            <button type="submit" class="auth-button">Enviar link</button>
        </form>
        <a class="auth-link" href="{% url 'login' %}">Voltar para o login</a>
    </div></main>
</body>
</html>
